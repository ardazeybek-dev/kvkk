name: Publish

# Publishes the package to PyPI.
#
# A pushed version tag is the trigger: tagging is the act that declares a
# version, and it is a plain git operation, so releasing never depends on
# reaching the GitHub web UI. Publishing a GitHub release still works too,
# and the workflow can always be run by hand.
#
# Authentication uses trusted publishing: there is no API token stored in
# the repository, PyPI trusts this workflow directly.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Validate metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for trusted publishing; used instead of a password or token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
